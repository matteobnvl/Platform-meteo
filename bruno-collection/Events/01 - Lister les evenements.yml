info:
  name: Lister les evenements
  type: http
  seq: 1

http:
  method: GET
  url: "http://localhost:8080/events"
  auth: inherit
  params:
    - name: type
      value: heatwave
      enabled: false
      type: query
    - name: from
      value: "2026-05-01"
      enabled: false
      type: query
    - name: to
      value: "2026-06-30"
      enabled: false
      type: query
    - name: limit
      value: "50"
      enabled: false
      type: query
    - name: offset
      value: "0"
      enabled: false
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
